name: Flutter CI (wiederverwendbar)

# Stufe 1: läuft bei jedem Push und jedem Pull Request der aufrufenden App.
# Formatierung, statische Analyse und Tests, ohne Build. Ziel: höchstens 5 Minuten.
# Auslöser, `concurrency` und Berechtigungen legt die aufrufende Datei fest.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Ordner der Flutter-App (Monorepo), sonst Repo-Wurzel
        type: string
        default: .
      flutter-version:
        type: string
        default: 3.44.0
      apt-packages:
        description: Zusätzliche Linux-Pakete, durch Leerzeichen getrennt (zum Beispiel libsqlite3-dev)
        type: string
        default: ''
      pre-test-command:
        description: Befehl vor Analyse und Tests (zum Beispiel Codegenerierung)
        type: string
        default: ''
      check-format:
        description: dart format prüfen
        type: boolean
        default: true
      test-args:
        description: Zusätzliche Argumente für flutter test
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      - name: Linux-Pakete bereitstellen
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $APT_PACKAGES

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Vorbereitung
        if: inputs.pre-test-command != ''
        env:
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: bash -c "$PRE_TEST_COMMAND"

      - name: Formatierung
        if: inputs.check-format
        run: dart format --output=none --set-exit-if-changed .

      - name: Statische Analyse
        run: flutter analyze

      - name: Unit- und Widget-Tests
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          # shellcheck disable=SC2086
          flutter test --reporter expanded $TEST_ARGS
