name: Workflows prüfen

# Die Vorlagen betreffen alle Apps. Ein Tippfehler hier macht überall die CI rot,
# deshalb prüft actionlint jede Änderung, bevor sie auf main landet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint herunterladen
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: Workflows und Beispiele prüfen
        run: ./actionlint -color .github/workflows/*.yml examples/*.yml
